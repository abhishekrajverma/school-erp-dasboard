services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-true}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Server-side BFF proxy → ASP.NET on the host machine (Windows/Mac)
      API_URL: ${API_URL:-http://host.docker.internal:5000/api}
    restart: unless-stopped
